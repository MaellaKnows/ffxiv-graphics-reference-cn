site_name: FFXIV Graphics Reference CN
site_url: https://maellaknows.github.io/ffxiv-graphics-reference-cn/
site_description: 中文 Final Fantasy XIV 图形渲染与 Mod 制作参考文档
site_author: Maella knows

repo_name: GitHub
repo_url: https://github.com/MaellaKnows/ffxiv-graphics-reference-cn


theme:
  name: material
  language: zh
  custom_dir: overrides

  logo: assets/images/icons.png
  favicon: assets/images/icons.png


  icon:
    repo: fontawesome/brands/github

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换至暗色模式

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换至亮色模式

  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top

    - toc.follow

    - search.highlight
    - search.suggest
    - search.share

    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes

nav:
  - 首页: index.md

  - 入门:
      - getting-started/index.md
      - 安装环境: getting-started/installation.md
      - FF14的文件结构: getting-started/folder-structure.md
      - 名词解释: getting-started/glossary.md

  - Shaders着色器:
      - Shader Reference: shaders/shader-reference.md

      - Character Shaders:
          - Character Shader (最常用着色器): shaders/character-shaders.md
          - CharacterLegacy Shader (遗产着色器): shaders/character-legacy shader.md
          - Tattoo Shader: shaders/character-tattoo-shaders.md
          - Transparency Shader: shaders/character-transparency-shader.md

      - Face & Eye:
          - Face Shader: shaders/face-shaders.md
          - Eye Shader: shaders/eye-shaders.md
          - Eye Occlusion Shader: shaders/eye-occlusion-shader.md

      - Material Shaders:
          - Hair Shader: shaders/hair-shaders.md
          - Skin Shader: shaders/skin-shaders.md
          - Glass Shader: shaders/glass-shader.md
          - Stocking Shader: shaders/stocking-shader.md

      - Additional Data:
          - Additional Data: shaders/additional-data.md

  - Material材质:
      - materials/index.md
      - MTRL 格式: materials/mtrl-format.md
      - Material Constants: materials/constants.md
      - Sampler: materials/sampler.md
      - Shader Keys: materials/shader-keys.md

  - Texture贴图:
      - textures/index.md
      - Base Color: textures/base-color.md
      - Normal Map: textures/normal-map.md
      - Mask Map: textures/mask-map.md
      - Multi Map: textures/multi-map.md
      - Color Set: textures/color-set.md
      - Eye Textures: textures/eye-textures.md

  - Workflow工作流程:
      - workflows/index.md
      - Blender: workflows/blender.md
      - TexTools: workflows/textools.md
      - Penumbra: workflows/penumbra.md
      - 故障排除: workflows/troubleshooting.md

  - Mod 制作:
      - modding/index.md
      - Mod制作基础: modding/modding-basics.md
      - Mod制作工具: modding/modding-tools.md
      - Mod制作教程: modding/modding-tutorials.md
      - Mod制作资源: modding/modding-resources.md
      - 其他外部链接: modding/other-links.md

  - 附录:
      - appendix/index.md
      - 术语表: appendix/glossary.md
      - 更新日志: appendix/changelog.md
      - 参考资料: appendix/references.md
      - 材质表: appendix/materials-table.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences
  - pymdownx.highlight

  - toc:
      permalink: true

  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite

  - pymdownx.snippets

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js

extra:
    social:
      - icon: fontawesome/brands/github
        link: https://github.com/MaellaKnows/ffxiv-graphics-reference-cn

      - icon: fontawesome/brands/discord
        link: https://discord.gg/MaKs9YcmK9

      - icon: blender
        link: https://www.blender.org

      - icon: fontawesome/solid/cube
        link: https://www.xivmodarchive.com/