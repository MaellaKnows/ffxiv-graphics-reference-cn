<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="sphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#333333"/>
    </radialGradient>
  </defs>

  <!-- 标志图标 -->
  <circle cx="16" cy="11" r="10" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="2 3"/>
  <polygon points="16,2 24,11 16,20 8,11" fill="none" stroke="#666" stroke-width="1"/>
  <!-- 菱形填充（模拟渐变） -->
  <polygon points="16,2 8,11 16,11" fill="#ccc"/>
  <polygon points="16,2 24,11 16,11" fill="#555"/>
  <polygon points="16,20 8,11 16,11" fill="#ccc"/>
  <polygon points="16,20 24,11 16,11" fill="#555"/>
  <!-- 中心圆 -->
  <circle cx="16" cy="11" r="3" fill="none" stroke="#666" stroke-width="1"/>
  <circle cx="16" cy="11" r="1.5" fill="url(#sphere)"/>
  <!-- 连接点 -->
  <circle cx="16" cy="1" r="0.5" fill="#666"/>
  <circle cx="16" cy="21" r="0.5" fill="#666"/>
  <circle cx="6" cy="11" r="0.5" fill="#666"/>
  <circle cx="26" cy="11" r="0.5" fill="#666"/>

  <!-- 文本区域 (GRC) -->
  <text x="16" y="27" font-family="Arial, sans-serif" font-size="5" font-weight="bold" text-anchor="middle" fill="#444" letter-spacing="1">GRC</text>

  <!-- 装饰性横线 -->
  <line x1="6" y1="29" x2="12" y2="29" stroke="#444" stroke-width="0.5"/>
  <polygon points="14,29 15,28 16,29 15,30" fill="#444"/>
  <line x1="17" y1="29" x2="26" y2="29" stroke="#444" stroke-width="0.5"/>
</svg>